<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="ic_small.jpg">
    <title>s7venSea</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=TASA+Orbiter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="profile-container">
            <div class="user-info">
                <img src="ic_large.jpg" alt="Avatar" class="avatar">
                <div class="intro">
                    <h1>s7venSea</h1>
                </div>
            </div>
            <div class="header-controls">
                <button id="dot-toggle">Disable Effect</button>
                <button id="theme-toggle">Light Mode</button>
            </div>
        </div>
        <nav>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>
        <section id="projects">
            <div class="section-header">
                <h2>Projects <span class="count-badge">1</span></h2>
            </div>
            <div class="grid">
                <div class="card">
                    <img src="ah_icon.webp" alt="Arcane Hunter">
                    <div class="card-content">
                        <h3>Arcane Hunter: Soul Survivor</h3>
                        <p class="card-description">A high-pace Action RPG game.</p>
                        <div class="card-links">
                            <a href="https://play.google.com/store/search?q=arcane%20hunter&c=apps&hl=en" target="_blank">Android</a>
                            <a href="https://apps.apple.com/us/app/arcane-hunter-soul-survivor/id6740374474" target="_blank" class="btn-secondary">iOS</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="contact">
            <h2>Contact</h2>
            <ul class="contact-list">
                <li><strong>Email:</strong></li>
                <li><a href="mailto:s7vensea.gamedev@gmail.com" class="email-link">s7vensea.gamedev@gmail.com</a></li>
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 s7venSea</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
